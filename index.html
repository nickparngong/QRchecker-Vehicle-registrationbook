<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fleet Barcode Checker V2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: #f1f5f9;
  color: #0f172a;
}

header {
  background: #0b2d55;
  color: white;
  padding: 18px 24px;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 4px 0 0;
  opacity: .9;
}

.container {
  max-width: 1250px;
  margin: 20px auto;
  padding: 0 15px;
}

.alert {
  padding: 15px 18px;
  border-radius: 12px;
  margin-bottom: 15px;
  background: #fff7ed;
  border: 1px solid #fdba74;
}

.alert.success {
  background: #ecfdf5;
  border-color: #86efac;
  color: #166534;
}

.alert.error {
  background: #fef2f2;
  border-color: #fca5a5;
  color: #b91c1c;
}

.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.tab {
  border: 0;
  background: #e2e8f0;
  padding: 12px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.tab.active {
  background: #0b2d55;
  color: white;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.stat {
  background: white;
  border-radius: 15px;
  padding: 20px;
}

.stat-title {
  color: #475569;
}

.stat-number {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

.progress {
  height: 15px;
  background: #e2e8f0;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: #2563eb;
  width: 0%;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
}

button.primary {
  background: #2563eb;
  color: white;
}

button.danger {
  background: #dc2626;
  color: white;
}

button {
  border: 0;
  padding: 12px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.result {
  margin-top: 15px;
  padding: 18px;
  border-radius: 12px;
  background: #f8fafc;
}

.vehicle-title {
  font-size: 24px;
  font-weight: bold;
  color: #0b2d55;
}

.vehicle-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.vehicle-item {
  background: white;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 10px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
}

th {
  background: #f8fafc;
}

@media(max-width:800px) {
  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .form-row,
  .vehicle-grid {
    grid-template-columns: 1fr;
  }
}

@media(max-width:500px) {
  .stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Fleet Barcode Checker V2</h1>
  <p>Google Sheets • Multi-user</p>
</header>

<div class="container">

  <div id="connection" class="alert">
    กำลังเชื่อมต่อ Google Sheets...
  </div>

  <div class="tabs">

    <button class="tab active"
      onclick="showPage('dashboard',this)">
      Dashboard
    </button>

    <button class="tab"
      onclick="showPage('scan',this)">
      Scan Barcode
    </button>

    <button class="tab"
      onclick="showPage('search',this)">
      ค้นหาทะเบียน
    </button>

    <button class="tab"
      onclick="showPage('history',this)">
      Scan History
    </button>

  </div>


  <!-- DASHBOARD -->

  <section id="dashboard" class="page active">

    <div class="stats">

      <div class="stat">
        <div class="stat-title">รถทั้งหมด</div>
        <div id="total" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">พบเล่ม</div>
        <div id="found" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">ไม่พบเล่ม</div>
        <div id="notfound" class="stat-number">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">ยังไม่ตรวจ</div>
        <div id="pending" class="stat-number">0</div>
      </div>

    </div>

    <div class="card">

      <h3>ความคืบหน้า</h3>

      <div id="progressText">0%</div>

      <br>

      <div class="progress">
        <div id="progressBar"
             class="progress-bar"></div>
      </div>

    </div>

    <div class="card">

      <button class="primary"
              onclick="loadData()">
        ↻ รีเฟรชจาก Google Sheets
      </button>

    </div>

  </section>


  <!-- SCAN -->

  <section id="scan" class="page">

    <div class="card">

      <h2>ตรวจเล่มทะเบียน</h2>

      <div class="form-row">

        <div>
          <label>Barcode</label>
          <input
            id="barcode"
            placeholder="เช่น 0100147330M"
            autofocus>
        </div>

        <div>
          <label>ผู้ตรวจ</label>
          <input
            id="inspector"
            placeholder="ชื่อผู้ตรวจ">
        </div>

      </div>

      <br>

      <button class="primary"
              onclick="searchBarcode()">
        🔎 ค้นหา Barcode
      </button>

      <div id="scanResult"></div>

    </div>

  </section>


  <!-- SEARCH -->

  <section id="search" class="page">

    <div class="card">

      <h2>ค้นหาทะเบียนรถ</h2>

      <input
        id="plateSearch"
        placeholder="กรอกทะเบียนรถ">

      <br><br>

      <button class="primary"
              onclick="searchPlate()">
        ค้นหา
      </button>

      <div id="plateResult"></div>

    </div>

  </section>


  <!-- HISTORY -->

  <section id="history" class="page">

    <div class="card">

      <h2>Scan History</h2>

      <div style="overflow:auto">

        <table>

          <thead>
            <tr>
              <th>วันที่</th>
              <th>เวลา</th>
              <th>Barcode</th>
              <th>ทะเบียน</th>
              <th>ผู้ตรวจ</th>
              <th>ผลการตรวจ</th>
            </tr>
          </thead>

          <tbody id="historyBody"></tbody>

        </table>

      </div>

    </div>

  </section>

</div>


<script>

/* ==========================================
   GOOGLE APPS SCRIPT WEB APP
========================================== */

const API =
"https://script.google.com/macros/s/AKfycbyM7emX7Ot_JAamUG1TV3c3QooWjPErx1jk2ZpcJVw86TGyJ9B0q0a2tigKJvZwnQ2rag/exec";


let vehicles = [];
let history = [];

let vehicleHeaders = [];
let historyHeaders = [];


/* ==========================================
   JSONP
========================================== */

function api(action, params = {}) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "jsonp_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement("script");

    const query =
      new URLSearchParams();

    query.set("action", action);
    query.set("callback", callbackName);

    Object.keys(params).forEach(key => {
      query.set(key, params[key]);
    });

    const timeout =
      setTimeout(() => {

        cleanup();

        reject(
          new Error("หมดเวลาการเชื่อมต่อ Google Sheets")
        );

      }, 20000);


    window[callbackName] = function(data) {

      clearTimeout(timeout);

      cleanup();

      resolve(data);

    };


    function cleanup() {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }


    script.onerror = function() {

      clearTimeout(timeout);

      cleanup();

      reject(
        new Error("ไม่สามารถเชื่อมต่อ Google Apps Script")
      );

    };


    script.src =
      API +
      "?" +
      query.toString();

    document.body.appendChild(script);

  });

}


/* ==========================================
   LOAD DATA
========================================== */

async function loadData() {

  setConnection(
    "กำลังโหลดข้อมูลจาก Google Sheets...",
    "normal"
  );

  try {

    const data =
      await api("getAll");

    if (!data || !data.ok) {

      throw new Error(
        data && data.error
          ? data.error
          : "Google Sheets ไม่ตอบข้อมูล"
      );

    }


    vehicleHeaders =
      data.vehicles.headers || [];

    vehicles =
      data.vehicles.rows || [];


    historyHeaders =
      data.history.headers || [];

    history =
      data.history.rows || [];


    updateDashboard();

    renderHistory();


    setConnection(
      "เชื่อมต่อ Google Sheets สำเร็จ",
      "success"
    );


  } catch (error) {

    console.error(error);

    setConnection(
      "เชื่อมต่อ Google Sheets ไม่สำเร็จ: " +
      error.message,
      "error"
    );

  }

}


/* ==========================================
   DASHBOARD
========================================== */

function updateDashboard() {

  const statusIndex =
    findHeader(
      vehicleHeaders,
      ["สถานะ"]
    );


  const total =
    vehicles.length;


  let found = 0;
  let notfound = 0;
  let pending = 0;


  vehicles.forEach(row => {

    const status =
      statusIndex >= 0
        ? String(row[statusIndex] || "").trim()
        : "";


    if (status === "พบเล่ม") {

      found++;

    } else if (status === "ไม่พบเล่ม") {

      notfound++;

    } else {

      pending++;

    }

  });


  document.getElementById("total")
    .textContent = total;

  document.getElementById("found")
    .textContent = found;

  document.getElementById("notfound")
    .textContent = notfound;

  document.getElementById("pending")
    .textContent = pending;


  const checked =
    found + notfound;

  const percent =
    total
      ? Math.round(
          checked / total * 100
        )
      : 0;


  document.getElementById("progressText")
    .textContent =
      percent + "%";


  document.getElementById("progressBar")
    .style.width =
      percent + "%";

}


/* ==========================================
   BARCODE SEARCH
========================================== */

function searchBarcode() {

  const code =
    document.getElementById("barcode")
      .value
      .trim();


  if (!code) {

    alert("กรุณากรอก Barcode");

    return;

  }


  const indexes =
    getVehicleIndexes();


  let found = null;


  for (const row of vehicles) {

    const match =
      indexes.some(index => {

        return normalize(row[index]) ===
               normalize(code);

      });


    if (match) {

      found = row;

      break;

    }

  }


  if (!found) {

    document.getElementById("scanResult")
      .innerHTML = `

        <div class="result">

          <div style="color:#dc2626;font-size:20px;font-weight:bold">
            ไม่พบ Barcode ใน Google Sheet
          </div>

          <div>
            ${escapeHtml(code)}
          </div>

        </div>

      `;

    return;

  }


  showVehicle(found);

}


/* ==========================================
   SHOW VEHICLE
========================================== */

function showVehicle(row) {

  const map =
    makeMap(vehicleHeaders);


  const barcode =
    value(row, map.barcode);

  const plate =
    value(row, map.plate);

  const vehicleId =
    value(row, map.id);

  const month =
    value(row, map.month);

  const province =
    value(row, map.province);

  const status =
    value(row, map.status);

  const area =
    value(row, map.area);


  const result =
    document.getElementById("scanResult");


  result.innerHTML = `

    <div class="result">

      <div class="vehicle-title">
        ${escapeHtml(plate || "ไม่ระบุทะเบียน")}
      </div>

      <div class="vehicle-grid">

        <div class="vehicle-item">
          <b>Vehicle ID</b><br>
          ${escapeHtml(vehicleId)}
        </div>

        <div class="vehicle-item">
          <b>Barcode</b><br>
          ${escapeHtml(barcode)}
        </div>

        <div class="vehicle-item">
          <b>เดือนจดทะเบียน</b><br>
          ${escapeHtml(month)}
        </div>

        <div class="vehicle-item">
          <b>จังหวัด</b><br>
          ${escapeHtml(province)}
        </div>

        <div class="vehicle-item">
          <b>พื้นที่</b><br>
          ${escapeHtml(area)}
        </div>

        <div class="vehicle-item">
          <b>สถานะปัจจุบัน</b><br>
          ${escapeHtml(status)}
        </div>

      </div>

      <br>

      ${
        status &&
        status !== "ยังไม่ตรวจ"
        ? `
          <div class="alert error">
            รถคันนี้ตรวจแล้ว ไม่สามารถตรวจซ้ำได้
          </div>
        `
        : `

          <button class="primary"
            onclick="saveScan('พบเล่ม')">
            ✓ พบเล่ม
          </button>

          <button class="danger"
            onclick="saveScan('ไม่พบเล่ม')">
            ✕ ไม่พบเล่ม
          </button>

        `
      }

    </div>

  `;

}


/* ==========================================
   SAVE SCAN
========================================== */

async function saveScan(status) {

  const code =
    document.getElementById("barcode")
      .value
      .trim();


  const inspector =
    document.getElementById("inspector")
      .value
      .trim();


  if (!inspector) {

    alert("กรุณาระบุชื่อผู้ตรวจ");

    return;

  }


  try {

    document.getElementById("scanResult")
      .innerHTML +=
      `<p>กำลังบันทึก...</p>`;


    const result =
      await api(
        "scan",
        {
          code: code,
          inspector: inspector,
          status: status
        }
      );


    if (!result.ok) {

      if (result.duplicate) {

        alert(
          "รถคันนี้ถูกตรวจไปแล้ว"
        );

      } else {

        alert(
          result.error ||
          "บันทึกไม่สำเร็จ"
        );

      }

      await loadData();

      return;

    }


    alert(
      "บันทึกสำเร็จ"
    );


    await loadData();


    document.getElementById("scanResult")
      .innerHTML = `

        <div class="result">

          <div style="color:#15803d;font-size:22px;font-weight:bold">
            ✓ บันทึกสำเร็จ
          </div>

          <p>
            Barcode:
            ${escapeHtml(code)}
          </p>

          <p>
            ผลการตรวจ:
            ${escapeHtml(status)}
          </p>

          <p>
            ผู้ตรวจ:
            ${escapeHtml(inspector)}
          </p>

        </div>

      `;


  } catch (error) {

    alert(
      "เกิดข้อผิดพลาด: " +
      error.message
    );

  }

}


/* ==========================================
   SEARCH PLATE
========================================== */

function searchPlate() {

  const search =
    normalize(
      document.getElementById("plateSearch")
        .value
    );


  if (!search) {

    alert("กรุณากรอกทะเบียน");

    return;

  }


  const map =
    makeMap(vehicleHeaders);


  const results =
    vehicles.filter(row => {

      return normalize(
        value(row, map.plate)
      ).includes(search);

    });


  const container =
    document.getElementById("plateResult");


  if (!results.length) {

    container.innerHTML =
      `<div class="result">
        ไม่พบทะเบียน
      </div>`;

    return;

  }


  container.innerHTML =
    results.map(row => {

      return `

        <div class="result">

          <div class="vehicle-title">
            ${escapeHtml(
              value(row,map.plate)
            )}
          </div>

          <p>
            Barcode:
            ${escapeHtml(
              value(row,map.barcode)
            )}
          </p>

          <p>
            สถานะ:
            ${escapeHtml(
              value(row,map.status)
            )}
          </p>

          <p>
            เดือนจดทะเบียน:
            ${escapeHtml(
              value(row,map.month)
            )}
          </p>

        </div>

      `;

    }).join("");

}


/* ==========================================
   HISTORY
========================================== */

function renderHistory() {

  const map =
    makeHistoryMap(historyHeaders);


  const body =
    document.getElementById("historyBody");


  body.innerHTML =
    history
      .slice()
      .reverse()
      .slice(0,200)
      .map(row => {

        return `

          <tr>

            <td>
              ${escapeHtml(
                value(row,map.date)
              )}
            </td>

            <td>
              ${escapeHtml(
                value(row,map.time)
              )}
            </td>

            <td>
              ${escapeHtml(
                value(row,map.code)
              )}
            </td>

            <td>
              ${escapeHtml(
                value(row,map.plate)
              )}
            </td>

            <td>
              ${escapeHtml(
                value(row,map.inspector)
              )}
            </td>

            <td>
              ${escapeHtml(
                value(row,map.result)
              )}
            </td>

          </tr>

        `;

      }).join("");

}


/* ==========================================
   HEADER MAP
========================================== */

function makeMap(headers) {

  return {

    id:
      findHeader(
        headers,
        ["VehicleID","Vehicle_ID","Vehicle ID"]
      ),

    barcode:
      findHeader(
        headers,
        ["Barcode","BARCODE"]
      ),

    qr:
      findHeader(
        headers,
        ["QRCode","QR_Code","QR Code"]
      ),

    plate:
      findHeader(
        headers,
        ["ทะเบียน","ทะเบียนรถ","License Plate"]
      ),

    month:
      findHeader(
        headers,
        ["เดือนจดทะเบียน","เดือน"]
      ),

    province:
      findHeader(
        headers,
        ["จังหวัด"]
      ),

    status:
      findHeader(
        headers,
        ["สถานะ"]
      ),

    inspector:
      findHeader(
        headers,
        ["ผู้ตรวจล่าสุด","ผู้ตรวจ"]
      ),

    date:
      findHeader(
        headers,
        ["วันที่ตรวจล่าสุด","วันที่"]
      ),

    time:
      findHeader(
        headers,
        ["เวลาตรวจล่าสุด","เวลา"]
      ),

    area:
      findHeader(
        headers,
        ["พื้นที่"]
      )

  };

}


function makeHistoryMap(headers) {

  return {

    date:
      findHeader(
        headers,
        ["วันที่","Date"]
      ),

    time:
      findHeader(
        headers,
        ["เวลา","Time"]
      ),

    code:
      findHeader(
        headers,
        [
          "Barcode",
          "BARCODE",
          "QR_Code",
          "QRCode"
        ]
      ),

    plate:
      findHeader(
        headers,
        ["ทะเบียน","ทะเบียนรถ"]
      ),

    inspector:
      findHeader(
        headers,
        ["ผู้ตรวจ","ผู้ตรวจล่าสุด"]
      ),

    result:
      findHeader(
        headers,
        ["ผลการตรวจ","สถานะ","Result"]
      )

  };

}


function getVehicleIndexes() {

  const map =
    makeMap(vehicleHeaders);


  return [
    map.barcode,
    map.qr,
    map.id,
    map.plate
  ].filter(i => i >= 0);

}


function findHeader(headers, aliases) {

  for (const alias of aliases) {

    const index =
      headers.findIndex(
        h =>
          String(h).trim() === alias
      );

    if (index >= 0) {
      return index;
    }

  }

  return -1;

}


function value(row,index) {

  return index >= 0
    ? String(row[index] ?? "")
    : "";

}


function normalize(value) {

  return String(
    value ?? ""
  )
  .trim()
  .toLowerCase();

}


function setConnection(text,type) {

  const box =
    document.getElementById("connection");

  box.textContent = text;

  box.className =
    "alert " +
    (type === "success"
      ? "success"
      : type === "error"
      ? "error"
      : "");

}


function showPage(id,button) {

  document
    .querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove("active")
    );


  document
    .querySelectorAll(".tab")
    .forEach(tab =>
      tab.classList.remove("active")
    );


  document
    .getElementById(id)
    .classList.add("active");


  button.classList.add("active");

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   START
========================================== */

loadData();

</script>

</body>
</html>
